{% load static %}
<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}VPN · Личный кабинет{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  <link href="{% static 'css/app-v4.css' %}" rel="stylesheet">
  <link href="{% static 'css/app-v4-portal.css' %}" rel="stylesheet">
</head>

<body class="customer-portal-shell">
  <header class="portal-shell-header">
    <div class="portal-shell-bar">
      <a class="portal-brand" href="{% url 'customer-portal-home' %}">
        <span class="portal-brand-mark" aria-hidden="true">A</span>
        <span>VPN</span>
      </a>

      {% if user.is_authenticated %}
        <div class="portal-shell-user">
          <div class="portal-shell-user-copy">
            <strong>{{ user.username }}</strong>
            <span>Личный кабинет</span>
          </div>
          <form method="post" action="{% url 'customer-portal-logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-secondary">Выйти</button>
          </form>
        </div>
      {% endif %}
    </div>
  </header>

  <main class="portal-shell-main">
    {% if messages %}
      <div class="portal-shell-messages" aria-live="polite">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
