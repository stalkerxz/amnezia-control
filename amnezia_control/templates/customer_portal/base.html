{% load static %}
<!doctype html>

<html lang="ru" data-bs-theme="dark">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="color-scheme"
    content="dark"
  >

  <title>
    {% block title %}
      VPN · Личный кабинет
    {% endblock %}
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="{% static 'css/app.css' %}"
    rel="stylesheet"
  >

  <link
    href="{% static 'css/app-v2.css' %}"
    rel="stylesheet"
  >

</head>


<body>

  <nav class="navbar border-bottom">

    <div class="container py-2">

      <a
        class="navbar-brand fw-semibold"
        href="{% url 'customer-portal-home' %}"
      >
        VPN · Личный кабинет
      </a>


      {% if user.is_authenticated %}

        <div class="d-flex align-items-center gap-3">

          <span class="text-secondary small">
            {{ user.username }}
          </span>

          <form
            method="post"
            action="{% url 'customer-portal-logout' %}"
            class="mb-0"
          >
            {% csrf_token %}

            <button
              type="submit"
              class="btn btn-sm btn-outline-secondary"
            >
              Выйти
            </button>

          </form>

        </div>

      {% endif %}

    </div>

  </nav>


  <main class="container py-4">

    {% if messages %}
      {% for message in messages %}
        <div
          class="alert alert-{{ message.tags|default:'info' }}"
        >
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

  </main>

</body>

</html>
