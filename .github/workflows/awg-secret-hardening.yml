name: AWG secret hardening

on:
  pull_request:
    paths:
      - "amnezia_control/jobs/services.py"
      - "amnezia_control/jobs/executors.py"
      - "amnezia_control/jobs/management/**"
      - "amnezia_control/jobs/test_runtime_secret_scrub.py"
      - "amnezia_control/servers/services.py"
      - "amnezia_control/servers/views.py"
      - "amnezia_control/servers/agent_backend.py"
      - "amnezia_control/servers/test_agent_backend.py"
      - "amnezia_control/servers/test_agent_vpn_artifact.py"
      - "amnezia_control/servers/tests.py"
      - "amnezia_control/templates/servers/detail.html"
      - "amnezia_control/vpn/services.py"
      - "amnezia_control/vpn/test_awg31.py"
      - "amnezia_control/vpn/test_awg31_secret_hardening.py"
      - "amnezia_control/vpn/test_prod_awg_runtime_hardening_v2.py"
      - "amnezia_control/servers/test_awg31_peer_count.py"
      - "amnezia_control/customers/**"
      - "amnezia_control/core/**"
      - "amnezia_control/templates/**"
      - "amnezia_control/static/css/app-v6.css"
      - "amnezia_control/static/js/app-v6.js"
      - ".github/workflows/ui-v6.yml"
      - ".github/workflows/awg-secret-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated test environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          FERNET_KEY="$(
            python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
          )"
          sed -i \
            -e 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=github-actions-awg-secret-hardening/' \
            -e "s|^CONFIG_ENCRYPTION_KEY=.*|CONFIG_ENCRYPTION_KEY=$FERNET_KEY|" \
            -e 's/^NOTIFICATIONS_ENABLED=.*/NOTIFICATIONS_ENABLED=0/' \
            -e 's/^ENABLE_RUNTIME_PEER_IMPORT=.*/ENABLE_RUNTIME_PEER_IMPORT=0/' \
            .env

      - name: Build test image
        run: docker compose -p awg_secret_ci build web

      - name: Run targeted tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -p awg_secret_ci run --rm --entrypoint "" web \
            python manage.py test \
            jobs.test_runtime_secret_scrub \
            vpn.test_awg31_secret_hardening \
            vpn.test_awg31 \
            vpn.test_prod_awg_runtime_hardening_v2 \
            vpn.test_runtime_persistence \
            vpn.test_runtime_safety \
            customers.test_ui_v6_unified_connection \
            core.test_dashboard_customer_metrics \
            core.test_mobile_shell \
            vpn.tests.VPNClientFlowTest \
            vpn.tests.VPNClientLimitsTest \
            servers.test_awg31_peer_count \
            servers.test_awg_address_pool \
            servers.test_agent_backend \
            servers.test_agent_vpn_artifact \
            servers.tests.RuntimeDetectionTest \
            servers.tests.ServerHealthEvaluationTest \
            servers.tests.ServerSyncDoesNotReenableDisabledProtocolTest \
            servers.tests.ServerMonitoringCollectMetricsTest

      - name: Full Django regression suite (visibility)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -p awg_secret_ci run --rm --entrypoint "" web \
            python manage.py test

      - name: Django system check
        run: |
          docker compose -p awg_secret_ci run --rm --entrypoint "" web \
            python manage.py check

      - name: Migration drift check
        run: |
          docker compose -p awg_secret_ci run --rm --entrypoint "" web \
            python manage.py makemigrations --check --dry-run

      - name: Cleanup
        if: always()
        run: docker compose -p awg_secret_ci down -v --remove-orphans
