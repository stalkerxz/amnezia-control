name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amnezia
          POSTGRES_USER: amnezia
          POSTGRES_PASSWORD: amnezia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amnezia -d amnezia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: amnezia_control.settings
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_DB: amnezia
      POSTGRES_USER: amnezia
      POSTGRES_PASSWORD: amnezia
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      CONFIG_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SSH_ALLOW_UNKNOWN_HOSTS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Django system check
        working-directory: amnezia_control
        run: python manage.py check
      - name: Migration drift check
        working-directory: amnezia_control
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite
        working-directory: amnezia_control
        run: python manage.py test
